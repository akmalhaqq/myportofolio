{% if user.is_authenticated %}
  <form
    method="post"
    action="{% url 'main:toggle_experience_star' experience.id %}"
    class="star-form"
  >
    {% csrf_token %}
    <button
      type="submit"
      class="button button-star{% if user in experience.starred_by.all %} is-starred{% endif %}"
      title="Jumlah star: {{ experience.starred_by.count }}"
    >
      <span aria-hidden="true">★</span>
      {% if user in experience.starred_by.all %}Unstar{% else %}Star{% endif %}
      <span class="star-count">{{ experience.starred_by.count }}</span>
    </button>
  </form>
{% else %}
  <a
    href="{% url 'main:login' %}?next={% url 'main:show_experience' %}"
    class="star-form button button-star"
    title="Login untuk memberi star"
  >
    <span aria-hidden="true">★</span>
    Star
    <span class="star-count">{{ experience.starred_by.count }}</span>
  </a>
{% endif %}
