<div
  id="edit-experience-modal"
  class="project-form-modal experience-edit-modal"
  popover="auto"
  role="dialog"
  aria-modal="true"
  aria-labelledby="edit-experience-modal-title"
>
  <button
    type="button"
    class="project-form-modal__backdrop"
    popovertarget="edit-experience-modal"
    popovertargetaction="hide"
    aria-label="Tutup form edit pengalaman"
  ></button>

  <div class="project-form-modal__content">
    <button
      type="button"
      class="project-form-modal__close"
      popovertarget="edit-experience-modal"
      popovertargetaction="hide"
      aria-label="Tutup form edit pengalaman"
    >×</button>

    <h2 id="edit-experience-modal-title">Edit Experience</h2>

    <form id="edit-experience-form" method="post" class="project-form">
      {% csrf_token %}
      <div class="experience-edit-layout">
        <div>
          {% for field in edit_form %}
            <div class="form-group">
              <label for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              {% if field.help_text %}
                <small class="form-help">{{ field.help_text }}</small>
              {% endif %}
            </div>
          {% endfor %}
        </div>
        <aside class="experience-edit-preview" aria-labelledby="experience-edit-preview-title">
          <h3 id="experience-edit-preview-title">Pratinjau</h3>
          <p class="form-help">Perubahan ini belum disimpan.</p>
          <div class="experience-meta">
            <span data-preview="category"></span> · <span data-preview="period"></span>
          </div>
          <h4 data-preview="title"></h4>
          <p class="experience-company" data-preview="company"></p>
          <p class="experience-description" data-preview="description"></p>
          <div class="experience-tags" data-preview="tags"></div>
        </aside>
      </div>

      <div class="project-form-modal__actions">
        <button
          type="button"
          class="button button-secondary"
          popovertarget="edit-experience-modal"
          popovertargetaction="hide"
        >Batal</button>
        <button type="submit" class="button">Simpan Perubahan</button>
      </div>
    </form>
  </div>
</div>
