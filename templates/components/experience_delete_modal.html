<button
  type="button"
  class="button button-danger"
  popovertarget="delete-experience-{{ experience.id }}"
  aria-label="Hapus {{ experience.title }}"
  title="Hapus experience"
>
  Hapus
</button>

<div
  id="delete-experience-{{ experience.id }}"
  class="project-delete-modal"
  popover="auto"
  role="dialog"
  aria-modal="true"
  aria-labelledby="delete-experience-title-{{ experience.id }}"
>
  <button
    type="button"
    class="project-delete-modal__backdrop"
    popovertarget="delete-experience-{{ experience.id }}"
    popovertargetaction="hide"
    aria-label="Tutup konfirmasi hapus"
  ></button>

  <div class="project-delete-modal__content">
    <button
      type="button"
      class="project-delete-modal__close"
      popovertarget="delete-experience-{{ experience.id }}"
      popovertargetaction="hide"
      aria-label="Tutup konfirmasi hapus"
    >
      ×
    </button>

    <h2 id="delete-experience-title-{{ experience.id }}" style="color: #d32f2f;">
      Hapus Experience?
    </h2>

    <p>
      Apakah Anda yakin ingin menghapus
      <strong>{{ experience.title }}</strong> di <strong>{{ experience.company }}</strong>?
    </p>

    <form method="post" action="{% url 'main:delete_experience' experience.id %}">
      {% csrf_token %}
      <div class="form-group" style="margin-bottom: 1.5rem; text-align: left;">
        <label for="secret_code_{{ experience.id }}" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Secret Code</label>
        <input type="password" id="secret_code_{{ experience.id }}" name="secret_code" placeholder="Enter secret code" required style="width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; background: var(--paper); color: var(--ink);">
      </div>

      <div class="project-delete-modal__actions">
        <button
          type="button"
          class="button button-secondary"
          popovertarget="delete-experience-{{ experience.id }}"
          popovertargetaction="hide"
        >
          Batal
        </button>

        <button type="submit" class="button button-danger">
          Ya, Hapus
        </button>
      </div>
    </form>
  </div>
</div>
