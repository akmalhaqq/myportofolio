<p class="experience-status">
  <button
    type="button"
    class="button button-danger"
    popovertarget="delete-project-{{ project.id }}"
    aria-label="Hapus {{ project.title }}"
    title="Hapus proyek"
  >
    Hapus Proyek
  </button>
</p>

<div
  id="delete-project-{{ project.id }}"
  class="project-delete-modal"
  popover="auto"
  role="dialog"
  aria-modal="true"
  aria-labelledby="delete-project-title-{{ project.id }}"
>
  <button
    type="button"
    class="project-delete-modal__backdrop"
    popovertarget="delete-project-{{ project.id }}"
    popovertargetaction="hide"
    aria-label="Tutup konfirmasi hapus"
  ></button>

  <div class="project-delete-modal__content">
    <button
      type="button"
      class="project-delete-modal__close"
      popovertarget="delete-project-{{ project.id }}"
      popovertargetaction="hide"
      aria-label="Tutup konfirmasi hapus"
    >
      ×
    </button>

    <h2 id="delete-project-title-{{ project.id }}">
      Hapus Project?
    </h2>

    <p>
      Apakah Anda yakin ingin menghapus
      <strong>{{ project.title }}</strong>?
    </p>

    <form method="post" action="{% url 'main:delete_project' project.id %}">
      {% csrf_token %}
      <div class="form-group" style="margin-bottom: 1.5rem; text-align: left;">
        <label for="secret_code_{{ project.id }}" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Secret Code</label>
        <input type="password" id="secret_code_{{ project.id }}" name="secret_code" placeholder="Enter secret code" required style="width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
      </div>

      <div class="project-delete-modal__actions">
        <button
          type="button"
          class="button button-secondary"
          popovertarget="delete-project-{{ project.id }}"
          popovertargetaction="hide"
        >
          Batal
        </button>

        <button type="submit" class="button button-danger">
          Ya, Hapus
        </button>
      </div>
    </form>
  </div>
</div>
